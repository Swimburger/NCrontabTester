name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          workloads: wasm-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Cloudflare dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean
        run: dotnet clean --configuration Release

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --configuration Release --no-restore --disable-build-servers -p:UseSharedCompilation=false

      - name: Publish optimized Release
        run: pnpm run build --no-restore

      - name: Build Cloudflare project
        run: pnpm run build:cloudflare:prebuilt

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run published app tests
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Audit NuGet dependencies
        run: dotnet package list --vulnerable --include-transitive

      - name: Audit pnpm dependencies
        run: pnpm audit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
